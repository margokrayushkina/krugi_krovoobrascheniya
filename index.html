<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кровообращение человека — Интерактивная симуляция</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to bottom, #0a0a1a, #1a1a3e, #0d1b2a);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Fallback контент на случай если JS не загрузится */
      #root:empty::before {
        content: '⏳ Загрузка симуляции кровообращения...';
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: white;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Глобальный обработчик ошибок для отладки
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.message, 'at', e.filename, ':', e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
